<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css">
<title>EcoPlate – Offres</title></head>
<body>
<header id="nav"></header>
<main class="wide">
  <div class="pagehead"><h2 id="offersTitle">Offres</h2><p id="offersDescription">Découvrez les surplus proposés par les associations, hôtels et restaurants.</p></div>
  <form id="offerFilters" class="card offer-filters">
    <div class="field"><label for="offerSearch">Rechercher un aliment</label><input id="offerSearch" name="q" maxlength="100" placeholder="Ex. : pommes"></div>
    <div class="field"><label for="organizationTypeFilter">Type d’organisation</label>
      <select id="organizationTypeFilter" name="organization_type">
        <option value="">Tous les types</option>
        <option value="association">Association</option>
        <option value="hotel">Hôtel</option>
        <option value="restaurant">Restaurant</option>
      </select>
    </div>
    <div class="field"><label for="offerStatusFilter">Statut</label>
      <select id="offerStatusFilter" name="status">
        <option value="active">Actives</option>
        <option value="all">Tous les statuts</option>
        <option value="sold_out">Épuisées</option>
        <option value="expired">Expirées</option>
      </select>
    </div>
    <button class="btn" type="submit">Filtrer</button>
  </form>
  <p class="msg" id="offerMessage" role="status" aria-live="polite"></p>
  <section class="announcement-list" id="offerList" aria-live="polite"></section>
</main>
<footer id="footer"></footer>
<script src="js/common.js"></script>
<script src="js/offers.js"></script>
</body></html>
